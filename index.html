<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sistema de gestión para la panadería Pan de Oro">
<title>Pan de Oro | Gestión de panadería</title>
<style>
:root{--green:#263d2e;--green2:#42664a;--gold:#d8ad59;--bg:#f6f6f1;--line:#e5e6dd;--muted:#777c72;--white:#fff;--red:#a63d32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#263229;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}aside{background:var(--green);color:white;padding:24px 15px}.brand{padding:0 10px 24px}.brand-icon{font-size:29px}.brand-name{font-size:21px;font-weight:800}.brand-sub{font-size:11px;color:#c4d5c2;margin-top:4px}.nav-label{font-size:10px;color:#adc0ac;letter-spacing:1.4px;padding:0 11px 10px}.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;text-align:left;font-size:13px;color:#dce8dc;background:transparent;border:0;margin:2px 0}.nav.active,.nav:hover{background:var(--green2);color:white}.content{padding:27px;min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.muted{font-size:12px;color:var(--muted)}.heading{font-size:23px;font-weight:780;letter-spacing:-.6px;margin-top:4px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{font-size:24px;font-weight:760;letter-spacing:-.8px;margin-top:8px}.subheading{font-size:14px;font-weight:750}.btn{border:1px solid #dcded4;border-radius:9px;padding:9px 12px;background:white;font-size:12px;font-weight:650;color:#263229}.primary{background:var(--gold);border-color:var(--gold);color:#263d2e}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}th{text-align:left;color:var(--muted);font-weight:650;background:#fafaf7}th,td{padding:12px 10px;border-bottom:1px solid #eee}td b{font-weight:750}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#e8f1e6;color:#37613b;font-size:10px;font-weight:750}.warning{background:#fff0d9;color:#956519}.danger{background:#fde8e4;color:#a23c31}.twocol{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:15px}.threecol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.bars{display:flex;align-items:end;gap:12px;height:130px;padding-top:15px}.barcol{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;gap:7px;font-size:10px;color:var(--muted)}.bar{background:#d7e4d1;border-radius:5px 5px 0 0;min-height:4px}.bar.today{background:var(--green2)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{width:100%;border:1px solid #dedfd6;border-radius:8px;padding:10px;background:white;color:#26372a;min-width:0;font-size:13px}label{display:block;font-size:12px;color:#62665c;margin-bottom:5px}.modal{position:fixed;inset:0;background:#15251bc9;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modalbox{background:white;border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px}.mobilehead{display:none}.footer{padding:22px 2px 5px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}.mobilehead{display:flex;align-items:center;justify-content:space-between;background:var(--green);color:white;padding:13px 16px}.sidebar{display:none}.sidebar.open{display:block}.content{padding:17px 13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}.heading{font-size:20px}}@media(max-width:430px){.threecol{grid-template-columns:1fr}.metric{font-size:21px}}
</style>
</head>
<body>
<div class="mobilehead"><strong>🥖 Pan de Oro</strong><button class="btn" id="mobmenu">☰ Menú</button></div>
<div class="layout">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">🥖</div><div class="brand-name">Pan de Oro</div><div class="brand-sub">Gestión de panadería</div></div><div class="nav-label">GENERAL</div><nav id="navs"></nav><div style="border-top:1px solid #506452;margin-top:20px;padding:17px 10px;font-size:11px;color:#c4d2c1">Sistema administrativo<br>Moneda: USD · Panamá</div></aside>
<main class="content"><div class="topbar"><div><div class="muted" id="today"></div><div class="heading" id="pagetitle">Resumen general</div><div class="muted" style="margin-top:4px">Controla tu panadería desde un solo lugar.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="export">↓ Exportar JSON</button><button class="btn" id="exportcsv">↓ Exportar ventas CSV</button><button class="btn primary" id="quickadd">＋ Registrar</button></div></div><div id="page"></div><div class="muted footer">Pan de Oro · Sistema administrativo · Los datos se guardan en este navegador.</div></main></div>
<div id="modalroot"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),todayISO=()=>new Date().toISOString().slice(0,10),money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navs=[['dashboard','▦','Dashboard'],['productos','▤','Mercancía'],['proveedores','♧','Proveedores'],['ventas','↗','Ventas'],['caja','＄','Caja'],['gastos','↘','Gastos'],['inventario','▥','Inventario'],['produccion','♨','Producción'],['perdidas','△','Pérdidas'],['cuentas','⇄','Cuentas por pagar/cobrar'],['empleados','♙','Empleados'],['ganancias','▥','Ganancias'],['cierre','✓','Cierre de caja']];
const seed={productos:[{id:1,nombre:'Pan de huevo',categoria:'Panadería',cantidad:80,costo:.20,precio:.40,vencimiento:''},{id:2,nombre:'Pan flauta',categoria:'Panadería',cantidad:55,costo:.25,precio:.50,vencimiento:''},{id:3,nombre:'Croissant',categoria:'Repostería',cantidad:8,costo:.55,precio:1,vencimiento:''},{id:4,nombre:'Harina de trigo',categoria:'Ingrediente',cantidad:3,costo:22,precio:0,vencimiento:''}],proveedores:[{id:5,nombre:'Distribuidora Central',telefono:'6000-1234',producto:'Harina de trigo',precio:22,deuda:44}],ventas:[],gastos:[],caja:[],produccion:[],perdidas:[],cuentas:[{id:6,tipo:'Por pagar',persona:'Distribuidora Central',concepto:'Compra de harina',monto:44,estado:'Pendiente'}],empleados:[],cierres:[],movimientos:[],next:100};
let db=loadDB(),current='dashboard';
function loadDB(){try{let s=localStorage.getItem('panDeOroDB');if(s){let x=JSON.parse(s);if(x&&Array.isArray(x.productos)&&Array.isArray(x.ventas))return {...structuredClone(seed),...x}}}catch(e){}return structuredClone(seed)}
function save(){try{localStorage.setItem('panDeOroDB',JSON.stringify(db));return true}catch(e){alert('No se pudieron guardar los datos en este navegador. Exporta una copia de seguridad.');return false}}
function total(a,k){return a.reduce((s,x)=>s+Number(x[k]||0),0)}
function sold(){return total(db.ventas,'total')}function expenses(){return total(db.gastos,'monto')}function cogs(){return total(db.ventas,'costo')}function net(){return sold()-cogs()-expenses()-total(db.perdidas,'costo')}
function metric(label,value,foot,icon){return `<div class="panel"><div style="display:flex;justify-content:space-between;gap:5px"><span class="muted">${label}</span><span>${icon}</span></div><div class="metric">${value}</div><div class="muted" style="margin-top:7px">${foot}</div></div>`}
function btn(label,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function panel(title,body,action=''){return `<section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px"><div class="subheading">${title}</div>${action}</div>${body}</section>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No hay registros todavía.</td></tr>`}</tbody></table></div>`}
function renderNav(){$('navs').innerHTML=navs.map(([id,ic,name])=>`<button class="nav ${current===id?'active':''}" data-page="${id}"><span style="width:19px;text-align:center">${ic}</span>${name}</button>`).join('')}
function payTotals(){let o={Efectivo:0,Yappy:0,Transferencia:0,Tarjeta:0,Otros:0};db.ventas.forEach(v=>o[v.medio]=(o[v.medio]||0)+Number(v.total));db.caja.filter(x=>x.tipo==='Entrada').forEach(x=>o[x.medio]=(o[x.medio]||0)+x.monto);return o}
function render(){renderNav();let nv=navs.find(x=>x[0]===current);$('pagetitle').textContent=nv[2];$('today').textContent=new Date().toLocaleDateString('es-PA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let html='';
if(current==='dashboard'){let low=db.productos.filter(x=>x.cantidad<=10&&x.cantidad>0),out=db.productos.filter(x=>x.cantidad<=0),recent=[...db.ventas].slice(-5).reverse();html=`<div class="cards">${metric('Ventas registradas',money(sold()),db.ventas.length+' transacciones','↗')}${metric('Gastos registrados',money(expenses()),'Gastos ingresados','↘')}${metric('Utilidad estimada',money(net()),'Según los registros disponibles','◈')}${metric('Productos registrados',db.productos.length,'Referencias de inventario','▤')}</div><div class="twocol" style="margin-top:15px">${panel('Ventas por día',`<div class="bars">${[6,5,4,3,2,1,0].map(d=>{let date=new Date();date.setDate(date.getDate()-d);let val=db.ventas.filter(v=>v.fecha===date.toISOString().slice(0,10)).reduce((s,v)=>s+v.total,0);return `<div class="barcol"><div class="bar ${d===0?'today':''}" style="height:${Math.max(4,val/(Math.max(1,sold()))*100)}%"></div><span>${date.toLocaleDateString('es-PA',{weekday:'short'}).slice(0,3)}</span></div>`}).join('')}</div><div class="muted">Basado en las ventas registradas.</div>`)}${panel('Alertas de inventario',`<div style="display:grid;gap:13px">${low.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px">${esc(x.nombre)}<span class="pill warning">${x.cantidad} unidades</span></div>`).join('')}${out.map(x=>`<div style="display:flex;justify-content:space-between;gap:8px">${esc(x.nombre)}<span class="pill danger">Agotado</span></div>`).join('')}${!low.length&&!out.length?'<span class="muted">Sin alertas de cantidad.</span>':''}<button class="btn" data-page="inventario">Ver inventario →</button></div>`)}</div><div style="margin-top:15px">${panel('Últimas ventas',table(['Fecha','Producto','Cantidad','Medio','Total'],recent.map(v=>`<tr><td>${esc(v.fecha)}</td><td>${esc(v.producto)}</td><td>${v.cantidad}</td><td>${esc(v.medio)}</td><td><b>${money(v.total)}</b></td></tr>`)),btn('＋ Registrar venta','add:ventas','btn primary'))}</div><div class="threecol" style="margin-top:15px">${metric('Por pagar',money(total(db.cuentas.filter(x=>x.tipo==='Por pagar'&&x.estado==='Pendiente'),'monto')),'Deudas pendientes','↘')}${metric('Por cobrar',money(total(db.cuentas.filter(x=>x.tipo==='Por cobrar'&&x.estado==='Pendiente'),'monto')),'Pendiente de clientes','↗')}${metric('Unidades en inventario',total(db.productos,'cantidad'),'Unidades registradas','▥')}</div>`}
else if(current==='productos')html=`<div class="cards">${metric('Referencias',db.productos.length,'Productos e ingredientes','▤')}${metric('Unidades disponibles',total(db.productos,'cantidad'),'Existencias registradas','▥')}${metric('Valor del inventario',money(db.productos.reduce((s,x)=>s+x.cantidad*x.costo,0)),'A costo unitario','＄')}${metric('Bajo inventario',db.productos.filter(x=>x.cantidad<=10).length,'10 unidades o menos','△')}</div><div style="margin-top:15px">${panel('Catálogo de mercancía',table(['Producto','Categoría','Cantidad','Costo','Precio venta','Margen unitario','Vencimiento','Acciones'],db.productos.map(x=>`<tr><td><b>${esc(x.nombre)}</b></td><td>${esc(x.categoria)}</td><td><span class="pill ${x.cantidad<=10?'warning':''}">${x.cantidad}</span></td><td>${money(x.costo)}</td><td>${money(x.precio)}</td><td>${money(x.precio-x.costo)}</td><td>${esc(x.vencimiento||'—')}</td><td><button class="btn" data-edit="${x.id}" data-kind="productos">Editar</button> <button class="btn" data-del="${x.id}" data-kind="productos">Eliminar</button></td></tr>`)),btn('＋ Nuevo producto','add:productos','btn primary'))}</div>`;
else if(current==='proveedores')html=panel('Directorio de proveedores',table(['Proveedor','Teléfono','Producto','Precio ref.','Deuda pendiente','Acciones'],db.proveedores.map(x=>`<tr><td><b>${esc(x.nombre)}</b></td><td>${esc(x.telefono)}</td><td>${esc(x.producto)}</td><td>${money(x.precio)}</td><td>${money(x.deuda)}</td><td><button class="btn" data-edit="${x.id}" data-kind="proveedores">Editar</button> <button class="btn" data-del="${x.id}" data-kind="proveedores">Eliminar</button></td></tr>`)),btn('＋ Añadir proveedor','add:proveedores','btn primary'));
else if(current==='ventas')html=`<div class="cards">${metric('Ventas acumuladas',money(sold()),db.ventas.length+' registros','↗')}${metric('Costo de ventas',money(cogs()),'Costo registrado','▤')}${metric('Margen bruto',money(sold()-cogs()),'Ventas menos costo','◈')}${metric('Transacciones',db.ventas.length,'Ventas individuales','▥')}</div><div style="margin-top:15px">${panel('Historial de ventas',table(['Fecha','Producto','Cantidad','Precio unit.','Costo total','Medio','Total','Acciones'],[...db.ventas].reverse().map(v=>`<tr><td>${esc(v.fecha)}</td><td>${esc(v.producto)}</td><td>${v.cantidad}</td><td>${money(v.precio)}</td><td>${money(v.costo)}</td><td>${esc(v.medio)}</td><td><b>${money(v.total)}</b></td><td><button class="btn" data-del="${v.id}" data-kind="ventas">Eliminar</button></td></tr>`)),btn('＋ Registrar venta','add:ventas','btn primary'))}</div>`;
else if(current==='caja'){let p=payTotals();html=`<div class="cards">${metric('Efectivo',money(p.Efectivo),'Entradas y ventas','＄')}${metric('Yappy',money(p.Yappy),'Entradas y ventas','↗')}${metric('Transferencias',money(p.Transferencia),'Entradas y ventas','⇄')}${metric('Tarjeta y otros',money(p.Tarjeta+p.Otros),'Otros medios','▤')}</div><div style="margin-top:15px">${panel('Movimientos de caja',table(['Fecha','Tipo','Concepto','Medio','Monto','Acciones'],[...db.caja].reverse().map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.tipo)}</td><td>${esc(x.concepto)}</td><td>${esc(x.medio)}</td><td>${money(x.monto)}</td><td><button class="btn" data-del="${x.id}" data-kind="caja">Eliminar</button></td></tr>`)),btn('＋ Registrar movimiento','add:caja','btn primary'))}<p class="muted">No existe conexión bancaria en tiempo real: registra manualmente cada movimiento.</p></div>`}
else if(current==='gastos')html=`<div class="cards">${metric('Gastos totales',money(expenses()),'Registros ingresados','↘')}${metric('Alquiler',money(total(db.gastos.filter(x=>x.categoria==='Alquiler'),'monto')),'Gastos categorizados','⌂')}${metric('Salarios',money(total(db.gastos.filter(x=>x.categoria==='Salarios'),'monto')),'Gastos categorizados','♙')}${metric('Otros gastos',money(total(db.gastos.filter(x=>!['Alquiler','Salarios'].includes(x.categoria)),'monto')),'Servicios y compras','▤')}</div><div style="margin-top:15px">${panel('Registro de gastos',table(['Fecha','Concepto','Categoría','Medio','Monto','Acciones'],[...db.gastos].reverse().map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.concepto)}</td><td>${esc(x.categoria)}</td><td>${esc(x.medio)}</td><td>${money(x.monto)}</td><td><button class="btn" data-del="${x.id}" data-kind="gastos">Eliminar</button></td></tr>`)),btn('＋ Registrar gasto','add:gastos','btn primary'))}</div>`;
else if(current==='inventario')html=`<div class="cards">${metric('Referencias',db.productos.length,'Productos e ingredientes','▤')}${metric('Unidades',total(db.productos,'cantidad'),'En inventario','▥')}${metric('Agotados',db.productos.filter(x=>x.cantidad<=0).length,'Reponer','△')}${metric('Bajo stock',db.productos.filter(x=>x.cantidad>0&&x.cantidad<=10).length,'10 unidades o menos','!')}</div><div style="margin-top:15px">${panel('Existencias y vencimientos',table(['Producto','Cantidad','Vencimiento','Estado','Acciones'],db.productos.map(x=>{let days=x.vencimiento?Math.ceil((new Date(x.vencimiento+'T00:00:00')-new Date(todayISO()+'T00:00:00'))/86400000):999;return `<tr><td>${esc(x.nombre)}</td><td>${x.cantidad}</td><td>${esc(x.vencimiento||'No registrado')}</td><td><span class="pill ${x.cantidad<=0||days<0?'danger':x.cantidad<=10||days<=3?'warning':''}">${x.cantidad<=0?'Agotado':days<0?'Vencido':days<=3?'Revisar':'Disponible'}</span></td><td><button class="btn" data-stock="${x.id}">＋ Entrada/salida</button></td></tr>`})),btn('＋ Nuevo producto','add:productos','btn primary'))}<p class="muted">Registra cada movimiento para mantener las existencias actualizadas.</p></div>`;
else if(current==='produccion')html=`<div class="cards">${metric('Lotes',db.produccion.length,'Producciones','♨')}${metric('Unidades producidas',total(db.produccion,'cantidad'),'Unidades declaradas','▤')}${metric('Costo de producción',money(total(db.produccion,'costo')),'Costo registrado','＄')}${metric('Costo promedio',money(total(db.produccion,'cantidad')?total(db.produccion,'costo')/total(db.produccion,'cantidad'):0),'Por unidad','◈')}</div><div style="margin-top:15px">${panel('Registro de elaboración',table(['Fecha','Producto','Cantidad','Ingredientes/receta','Costo lote','Costo unidad','Acciones'],[...db.produccion].reverse().map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.producto)}</td><td>${x.cantidad}</td><td>${esc(x.ingredientes)}</td><td>${money(x.costo)}</td><td>${money(x.cantidad?x.costo/x.cantidad:0)}</td><td><button class="btn" data-del="${x.id}" data-kind="produccion">Eliminar</button></td></tr>`)),btn('＋ Registrar producción','add:produccion','btn primary'))}<p class="muted">En esta versión, la producción no descuenta ingredientes automáticamente.</p></div>`;
else if(current==='perdidas')html=`<div class="cards">${metric('Registros',db.perdidas.length,'Pérdidas anotadas','△')}${metric('Costo de pérdidas',money(total(db.perdidas,'costo')),'Impacto económico','＄')}${metric('Unidades dañadas',total(db.perdidas.filter(x=>x.motivo==='Dañado'),'cantidad'),'Dañadas','!')}${metric('Unidades vencidas',total(db.perdidas.filter(x=>x.motivo==='Vencido'),'cantidad'),'Vencidas','◷')}</div><div style="margin-top:15px">${panel('Registro de mermas',table(['Fecha','Producto','Cantidad','Motivo','Costo','Acciones'],[...db.perdidas].reverse().map(x=>`<tr><td>${esc(x.fecha)}</td><td>${esc(x.producto)}</td><td>${x.cantidad}</td><td>${esc(x.motivo)}</td><td>${money(x.costo)}</td><td><button class="btn" data-del="${x.id}" data-kind="perdidas">Eliminar</button></td></tr>`)),btn('＋ Registrar pérdida','add:perdidas','btn primary'))}</div>`;
else if(current==='cuentas')html=`<div class="cards">${metric('Por pagar',money(total(db.cuentas.filter(x=>x.tipo==='Por pagar'&&x.estado==='Pendiente'),'monto')),'Deudas pendientes','↘')}${metric('Por cobrar',money(total(db.cuentas.filter(x=>x.tipo==='Por cobrar'&&x.estado==='Pendiente'),'monto')),'Por recuperar','↗')}${metric('Cuentas',db.cuentas.length,'Registradas','⇄')}${metric('Cerradas',db.cuentas.filter(x=>x.estado!=='Pendiente').length,'Pagadas/cobradas','✓')}</div><div style="margin-top:15px">${panel('Cuentas por pagar y cobrar',table(['Tipo','Persona/empresa','Concepto','Monto','Estado','Acciones'],[...db.cuentas].reverse().map(x=>`<tr><td>${esc(x.tipo)}</td><td>${esc(x.persona)}</td><td>${esc(x.concepto)}</td><td>${money(x.monto)}</td><td><span class="pill ${x.estado==='Pendiente'?'warning':''}">${esc(x.estado)}</span></td><td>${x.estado==='Pendiente'?`<button class="btn" data-paid="${x.id}" data-kind="cuentas">Marcar pagada</button>`:''} <button class="btn" data-del="${x.id}" data-kind="cuentas">Eliminar</button></td></tr>`)),btn('＋ Nueva cuenta','add:cuentas','btn primary'))}</div>`;
else if(current==='empleados')html=`<div class="cards">${metric('Empleados',db.empleados.length,'Personal registrado','♙')}${metric('Nómina mensual',money(total(db.empleados,'salario')),'Salarios ingresados','＄')}${metric('Pagos pendientes',db.empleados.filter(x=>x.pagado==='Pendiente').length,'Revisar','△')}${metric('Pagos completados',db.empleados.filter(x=>x.pagado==='Pagado').length,'Marcados como pagados','✓')}</div><div style="margin-top:15px">${panel('Personal y horarios',table(['Empleado','Puesto','Salario mensual','Horario','Pago','Acciones'],db.empleados.map(x=>`<tr><td>${esc(x.nombre)}</td><td>${esc(x.puesto)}</td><td>${money(x.salario)}</td><td>${esc(x.horario)}</td><td><span class="pill ${x.pagado==='Pendiente'?'warning':''}">${esc(x.pagado)}</span></td><td><button class="btn" data-paid="${x.id}" data-kind="empleados">Cambiar pago</button> <button class="btn" data-del="${x.id}" data-kind="empleados">Eliminar</button></td></tr>`)),btn('＋ Añadir empleado','add:empleados','btn primary'))}</div>`;
else if(current==='ganancias')html=`<div class="cards">${metric('Ingresos',money(sold()),'Ventas registradas','↗')}${metric('Costo de ventas',money(cogs()),'Costo de productos vendidos','▤')}${metric('Gastos y pérdidas',money(expenses()+total(db.perdidas,'costo')),'Registros operativos','↘')}${metric('Utilidad estimada',money(net()),'Según datos registrados','◈')}</div><div class="twocol" style="margin-top:15px">${panel('Resumen financiero',table(['Concepto','Importe'],[['Ventas brutas',money(sold())],['Costo de ventas',money(cogs())],['Utilidad bruta',money(sold()-cogs())],['Gastos',money(expenses())],['Pérdidas',money(total(db.perdidas,'costo'))],['Utilidad estimada',`<b>${money(net())}</b>`]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`)))}${panel('Nota contable',`<p class="muted" style="line-height:1.8">La utilidad es una estimación basada en los registros disponibles. Registra compras, inventario inicial, costos, salarios y gastos completos. Esta pantalla no reemplaza un estado financiero auditado.</p>`)}</div>`;
else if(current==='cierre'){let pay=payTotals(),cashOut=total(db.caja.filter(x=>x.tipo==='Salida'&&x.medio==='Efectivo'),'monto'),cashExpense=total(db.gastos.filter(x=>x.medio==='Efectivo'),'monto'),expected=(pay.Efectivo||0)-cashOut-cashExpense;html=`<div class="cards">${metric('Efectivo esperado',money(expected),'Ventas y salidas registradas','＄')}${metric('Ventas totales',money(sold()),'Todos los registros','↗')}${metric('Salidas de caja',money(cashOut),'Movimientos en efectivo','↘')}${metric('Cierres guardados',db.cierres.length,'Historial','✓')}</div><div class="twocol" style="margin-top:15px">${panel('Registrar cierre',`<p class="muted" style="line-height:1.7">Cuenta el dinero físico y confirma los medios digitales. El cálculo solo es fiable si los movimientos están completos y registrados correctamente.</p><form id="closeform"><div class="formgrid">${[['Efectivo contado','efectivo'],['Yappy confirmado','yappy'],['Transferencias','transferencia'],['Tarjeta','tarjeta'],['Otros medios','otros']].map(([l,k])=>`<div><label>${l} ($)</label><input class="field" name="${k}" type="number" min="0" step=".01" value="0" required></div>`).join('')}<div style="grid-column:1/-1"><label>Observaciones</label><textarea class="field" name="nota" rows="2"></textarea></div></div><button class="btn primary" style="margin-top:15px">Guardar cierre</button></form>`)}${panel('Historial de cierres',table(['Fecha','Efectivo esperado','Contado','Diferencia','Observación'],[...db.cierres].reverse().map(x=>`<tr><td>${esc(x.fecha)}</td><td>${money(x.esperado)}</td><td>${money(x.contado)}</td><td><b style="color:${x.diferencia<0?'#b34032':'#326a3a'}">${money(x.diferencia)}</b></td><td>${esc(x.nota||'—')}</td></tr>`)))}</div>`}
$('page').innerHTML=html}
function field(label,name,type='text',value='',opts=null,required=true){return `<div><label>${label}</label>${opts?`<select class="field" name="${name}" ${required?'required':''}>${opts.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="field" name="${name}" type="${type}" ${value===undefined?'':`value="${esc(value)}"`} ${required?'required':''} ${type==='number'?'step="any"':''}>`}</div>`}
function showModal(kind,editId=null){let old=editId?db[kind].find(x=>x.id===Number(editId)):null,title=old?'Editar registro':({'productos':'Nuevo producto','proveedores':'Nuevo proveedor','ventas':'Registrar venta','caja':'Movimiento de caja','gastos':'Registrar gasto','produccion':'Registrar producción','perdidas':'Registrar pérdida','cuentas':'Nueva cuenta','empleados':'Nuevo empleado'}[kind]||'Registrar'),body='';
if(kind==='productos')body=field('Nombre','nombre','text',old?.nombre||'')+field('Categoría','categoria','text',old?.categoria||'Panadería')+field('Cantidad','cantidad','number',old?.cantidad??0)+field('Costo unitario ($)','costo','number',old?.costo??0)+field('Precio venta ($)','precio','number',old?.precio??0)+field('Vencimiento','vencimiento','date',old?.vencimiento||'',null,false);
if(kind==='proveedores')body=field('Proveedor','nombre','text',old?.nombre||'')+field('Teléfono','telefono','tel',old?.telefono||'')+field('Producto principal','producto','text',old?.producto||'')+field('Precio referencia ($)','precio','number',old?.precio??0)+field('Deuda pendiente ($)','deuda','number',old?.deuda??0);
if(kind==='ventas')body=field('Producto','producto','text',db.productos[0]?.nombre||'',db.productos.map(x=>x.nombre))+field('Cantidad','cantidad','number',1)+field('Precio unitario ($)','precio','number',undefined)+field('Medio de pago','medio','text','Efectivo',['Efectivo','Yappy','Transferencia','Tarjeta','Otros'])+field('Fecha','fecha','date',todayISO())+field('Costo unitario ($)','costounitario','number',undefined);
if(kind==='caja')body=field('Tipo','tipo','text','Entrada',['Entrada','Salida'])+field('Concepto','concepto')+field('Medio','medio','text','Efectivo',['Efectivo','Yappy','Transferencia','Tarjeta','Otros'])+field('Monto ($)','monto','number',0)+field('Fecha','fecha','date',todayISO());
if(kind==='gastos')body=field('Concepto','concepto')+field('Categoría','categoria','text','Compras',['Alquiler','Electricidad','Agua','Transporte','Salarios','Compras','Mantenimiento','Otros'])+field('Monto ($)','monto','number',0)+field('Medio','medio','text','Efectivo',['Efectivo','Yappy','Transferencia','Tarjeta','Otros'])+field('Fecha','fecha','date',todayISO());
if(kind==='produccion')body=field('Producto elaborado','producto','text',db.productos[0]?.nombre||'',db.productos.map(x=>x.nombre))+field('Cantidad producida','cantidad','number',1)+field('Ingredientes y cantidades','ingredientes','text','Harina, azúcar, levadura...')+field('Costo total lote ($)','costo','number',0)+field('Fecha','fecha','date',todayISO());
if(kind==='perdidas')body=field('Producto','producto','text',db.productos[0]?.nombre||'',db.productos.map(x=>x.nombre))+field('Cantidad perdida','cantidad','number',1)+field('Motivo','motivo','text','No vendido',['Dañado','Vencido','No vendido','Otro'])+field('Costo unitario ($)','costounitario','number',0)+field('Fecha','fecha','date',todayISO());
if(kind==='cuentas')body=field('Tipo','tipo','text','Por pagar',['Por pagar','Por cobrar'])+field('Persona o empresa','persona')+field('Concepto','concepto')+field('Monto ($)','monto','number',0)+field('Estado','estado','text','Pendiente',['Pendiente','Pagada/Cobrada']);
if(kind==='empleados')body=field('Nombre completo','nombre')+field('Puesto','puesto')+field('Salario mensual ($)','salario','number',0)+field('Horario','horario')+field('Pago','pagado','text','Pendiente',['Pendiente','Pagado']);
$('modalroot').innerHTML=`<div class="modal" id="overlay"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div style="font-size:19px;font-weight:750">${title}</div><button class="btn" data-close>✕</button></div><form id="entryform"><div class="formgrid">${body}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px"><button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form></div></div>`;
const form=$('entryform');if(old)Object.entries(old).forEach(([k,v])=>{if(form.elements[k]&&form.elements[k].tagName==='INPUT')form.elements[k].value=v});
if(kind==='ventas'&&!old){const upd=()=>{let x=db.productos.find(x=>x.nombre===form.elements.producto.value);if(x){form.elements.precio.value=x.precio;form.elements.costounitario.value=x.costo}};upd();form.elements.producto.addEventListener('change',upd)}
form.onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(form).entries());['cantidad','precio','costo','costounitario','monto','deuda','salario'].forEach(k=>{if(o[k]!==undefined)o[k]=Number(o[k])});o.id=old?old.id:db.next++;
if(kind==='ventas'){o.cantidad=Number(o.cantidad);o.precio=Number(o.precio);o.costo=o.cantidad*Number(o.costounitario||0);o.total=o.cantidad*o.precio;delete o.costounitario;let x=db.productos.find(x=>x.nombre===o.producto);if(x&&x.cantidad<o.cantidad)return alert('Inventario insuficiente. Disponible: '+x.cantidad);if(x)x.cantidad-=o.cantidad}
if(kind==='perdidas'){o.costo=o.cantidad*Number(o.costounitario||0);delete o.costounitario;let x=db.productos.find(x=>x.nombre===o.producto);if(x&&x.cantidad<o.cantidad)return alert('Inventario insuficiente.');if(x)x.cantidad-=o.cantidad}
if(kind==='produccion'){o.cantidad=Number(o.cantidad);o.costo=Number(o.costo);let x=db.productos.find(x=>x.nombre===o.producto);if(x)x.cantidad+=o.cantidad}
if(kind==='caja')o.monto=Number(o.monto);
if(old)db[kind][db[kind].findIndex(x=>x.id===old.id)]={...old,...o};else db[kind].push(o);
if(kind==='proveedores'&&o.deuda>0&&!db.cuentas.some(x=>x.persona===o.nombre&&x.tipo==='Por pagar'&&x.estado==='Pendiente'))db.cuentas.push({id:db.next++,tipo:'Por pagar',persona:o.nombre,concepto:'Deuda con proveedor',monto:o.deuda,estado:'Pendiente'});
save();$('modalroot').innerHTML='';render()}}
function stockModal(id){let x=db.productos.find(x=>x.id===Number(id));if(!x)return;$('modalroot').innerHTML=`<div class="modal"><div class="modalbox"><div class="subheading" style="margin-bottom:15px">Movimiento: ${esc(x.nombre)}</div><form id="stockform"><div class="formgrid">${field('Tipo','tipo','text','Entrada',['Entrada','Salida'])}${field('Cantidad','cantidad','number',1)}${field('Motivo','motivo','text','Compra / ajuste')}${field('Fecha','fecha','date',todayISO())}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary">Guardar</button></div></form></div></div>`;$('stockform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),q=Number(f.get('cantidad')),t=f.get('tipo');if(q<=0)return alert('Ingresa una cantidad mayor a cero.');if(t==='Salida'&&q>x.cantidad)return alert('Inventario insuficiente.');x.cantidad+=t==='Entrada'?q:-q;db.movimientos.push({id:db.next++,producto:x.nombre,cantidad:q,tipo:t,fecha:f.get('fecha'),motivo:f.get('motivo')});save();$('modalroot').innerHTML='';render()}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.page){current=b.dataset.page;render();return}if(b.dataset.action){if(b.dataset.action.startsWith('add:'))showModal(b.dataset.action.split(':')[1]);return}if(b.hasAttribute('data-close')){$('modalroot').innerHTML='';return}if(b.dataset.edit){showModal(b.dataset.kind,b.dataset.edit);return}if(b.dataset.stock){stockModal(b.dataset.stock);return}if(b.dataset.paid){let kind=b.dataset.kind||'cuentas',x=db[kind].find(x=>x.id===Number(b.dataset.paid));if(x){if(kind==='empleados')x.pagado=x.pagado==='Pagado'?'Pendiente':'Pagado';else x.estado='Pagada/Cobrada';save();render()}return}if(b.dataset.del){if(!confirm('¿Eliminar este registro?'))return;db[b.dataset.kind]=db[b.dataset.kind].filter(x=>x.id!==Number(b.dataset.del));save();render()}});
document.addEventListener('submit',e=>{if(e.target.id==='closeform'){e.preventDefault();let f=new FormData(e.target),expected=payTotals().Efectivo-total(db.gastos.filter(x=>x.medio==='Efectivo'),'monto')-total(db.caja.filter(x=>x.tipo==='Salida'&&x.medio==='Efectivo'),'monto'),count=Number(f.get('efectivo'));db.cierres.push({id:db.next++,fecha:todayISO(),esperado:expected,contado:count,diferencia:count-expected,nota:f.get('nota'),medios:Object.fromEntries(['yappy','transferencia','tarjeta','otros'].map(k=>[k,Number(f.get(k))]))});save();alert('Cierre guardado. Diferencia de efectivo: '+money(count-expected));render()}});
$('quickadd').onclick=()=>showModal(['productos','proveedores','ventas','caja','gastos','produccion','perdidas','cuentas','empleados'].includes(current)?current:'ventas');
$('export').onclick=()=>download('pan-de-oro-respaldo.json',JSON.stringify(db,null,2),'application/json');
$('exportcsv').onclick=()=>{let rows=[['Fecha','Producto','Cantidad','Precio unitario','Costo total','Medio de pago','Total'],...db.ventas.map(v=>[v.fecha,v.producto,v.cantidad,v.precio,v.costo,v.medio,v.total])];download('pan-de-oro-ventas.csv',rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')};
function download(name,data,type){let url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
$('mobmenu').onclick=()=>{$('sidebar').classList.toggle('open')};
render();
</script>
</body></html>
